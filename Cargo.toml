[workspace]
resolver = "2"
members = [
    "crates/worknest-core",
    "crates/worknest-db",
    "crates/worknest-auth",
    "crates/worknest-api",
]
# Exclude the retired egui frontend so workspace-wide commands don't touch it.
# It still compiles standalone for wasm32 if anyone needs to bisect.
exclude = ["legacy/worknest-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Worknest Contributors"]
license = "MIT"
repository = "https://github.com/DScudeler/Worknest"
homepage = "https://github.com/DScudeler/Worknest"

[workspace.dependencies]
# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Identifiers
uuid = { version = "1.6", features = ["v4", "serde", "js"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Database
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
refinery = { version = "0.9", features = ["rusqlite"] }

# Authentication
bcrypt = "0.17"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
rand = "0.9.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal", "process", "io-util"] }

# Web framework
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
hyper = { version = "1.7", features = ["full"] }

# Testing
proptest = "1.4"
mockall = "0.13.1"
tempfile = "3.10"

# HTTP client (used by integration tests etc.)
reqwest = "0.12"

# Cron evaluation for the agents scheduler
cron = "0.15"

# Advisory file locking for per-deployment tick mutual exclusion
fs2 = "0.4"

# `async fn` in traits with dyn dispatch (used by the agents tick executor)
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2
