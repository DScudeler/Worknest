[project]
name = "worknest-mcp"
version = "0.1.0"
description = "MCP server wrapping the Worknest REST API for swarm agents"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
worknest-mcp = "worknest_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worknest_mcp"]

[tool.uv]
package = true

